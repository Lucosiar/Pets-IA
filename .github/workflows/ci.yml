name: CI

# Every push and pull request tests the agent and builds both apps; a v* tag also publishes a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: agent
      - run: bun test
        working-directory: agent
      - run: bunx tsc --noEmit
        working-directory: agent

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Swift tests
        run: swift run PetsCoreTests
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0-ci; fi
          (cd agent && bun install --frozen-lockfile)
          bun scripts/build.ts --version "$version"
      - name: Smoke test
        run: |
          dist/petsia-macos-arm64/petsia version
          dist/petsia-macos-arm64/petsia --help
      - name: End to end
        run: scripts/e2e-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-macos
          path: e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Agent tests on Windows
        working-directory: agent
        run: |
          bun install --frozen-lockfile
          bun test
      - name: Build
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0-ci; fi
          bun scripts/build.ts --version "$version"
      - name: Smoke test
        shell: bash
        run: |
          dist/petsia-windows-x64/petsia.exe version
          ls -la dist/petsia-windows-x64
      - name: End to end
        shell: pwsh
        run: scripts/e2e-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agent, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{macos,windows}"
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
